<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="favPink" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9043d"/>
      <stop offset="50%" stop-color="#ff1e56"/>
      <stop offset="100%" stop-color="#ff577d"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="favDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff1e56" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- High-Contrast Squircle Badge with Vibrant Crimson Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="#ff1e56" stroke-width="2.2" stroke-opacity="0.85"/>

  <!-- Left Facade Tower Pillar -->
  <path d="M12 51V27L22 19V51H12Z" fill="url(#favDark)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.6" stroke-linejoin="round"/>
  
  <!-- Center Soaring High-Rise Pinnacle (Elevex Crimson Apex) -->
  <path d="M22 51V15L32 7L42 15V51H22Z" fill="url(#favPink)" filter="url(#favGlow)"/>
  
  <!-- Right Facade Tower Pillar -->
  <path d="M42 51V19L52 27V51H42Z" fill="url(#favDark)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.6" stroke-linejoin="round"/>
  
  <!-- Center Facade Vertical Light Spire -->
  <line x1="32" y1="11" x2="32" y2="49" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Dual-Rope Dynamic Ascent Vectors (Vertical Elevation Symbol) -->
  <path d="M15 41L32 26L49 41" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 47L32 35L45 47" stroke="url(#favCyan)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
